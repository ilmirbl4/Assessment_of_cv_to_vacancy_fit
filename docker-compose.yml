services:
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - deploy/db.env
      - backend/.env
      - ml/.env
      - collector/.env
      - monitoring/.env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ${DATA_DIR:-./data}/reference:/data/reference:ro
      - ${DATA_DIR:-./data}/demo:/data/demo:ro
      - ${DATA_DIR:-./data}/input:/data/input:ro
      - runtime:/runtime
    stop_grace_period: 120s
    mem_limit: 6g
    cpus: 4
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
  frontend:
    build: ./frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend: {condition: service_healthy}
volumes:
  runtime:
