[project]
name = "vacancy-match-backend"
version = "0.1.0"
description = "Серверная часть системы подбора вакансий по резюме"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "asyncpg>=0.30",
    "razdel>=0.5",
    "numpy>=2.0",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fpdf2>=2.8",
    "lxml-stubs>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "D"]
allowed-confusables = ["×", "–", " ", "А", "Б", "В", "Г", "Д", "Е", "Ж", "З", "И", "Й", "К", "Л", "М", "Н", "О", "П", "Р", "С", "Т", "У", "Ф", "Х", "Ц", "Ч", "Ш", "Щ", "Ъ", "Ы", "Ь", "Э", "Ю", "Я", "а", "б", "в", "г", "д", "е", "ж", "з", "и", "й", "к", "л", "м", "н", "о", "п", "р", "с", "т", "у", "ф", "х", "ц", "ч", "ш", "щ", "ъ", "ы", "ь", "э", "ю", "я", "Ё", "ё"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S311"]
"scripts/**" = ["D", "S", "T20"]
"contract/**" = ["D"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["docx", "docx.*", "pypdf", "pypdf.*", "sentence_transformers", "sentence_transformers.*", "torch", "razdel", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # starlette.testclient советует httpx2; пакет не проверен, поэтому игнорируем только это предупреждение
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
markers = ["slow: тесты дольше 2 с", "real_model: тесты с настоящей моделью (make test-real)"]
addopts = "-m 'not real_model'"

[tool.coverage.run]
omit = ["app/ml/cross_encoder.py", "app/ml/bi_encoder.py"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
